name: ci

on:
  push:
    branches: [master, "feature/**", "fix/**"]
  pull_request:
    branches: [master]

# Cancel in-flight runs when a new commit lands on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit + UI + MCP tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_COLOR: "0"
      CI: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.11.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Reject floating dependency specifiers
        run: "! grep -nE '\"(latest|\\*)\"' package.json miro-custom-mcp/package.json"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install MCP workspace
        run: cd miro-custom-mcp && pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Contract version check
        run: pnpm run contracts:check

      - name: Build contracts JSON artifacts
        run: pnpm run contracts:build

      - name: Vitest (server, contracts, scripts, agents)
        run: pnpm test

      - name: Vitest DOM (React UI)
        run: pnpm run test:ui

      - name: MCP package tests
        run: cd miro-custom-mcp && pnpm test

      - name: Coverage gate
        run: pnpm run coverage

      - name: Smoke
        run: pnpm run smoke

      - name: Validate (file + seed sanity)
        run: pnpm run validate

      - name: Bench
        run: BENCH_ITER=10 pnpm run bench

  docker:
    name: Compose lint
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: docker compose config
        run: docker compose -f docker-compose.yml config -q

  container-build:
    name: Container build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [web, api, mcp]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build container without publishing
        run: docker build -f Dockerfile.${{ matrix.target }} -t miro-${{ matrix.target }}:test .

  publish-images:
    name: Build + push container images
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: [test, docker, container-build]
    permissions:
      contents: read
      packages: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/miro-workflows/web
            ghcr.io/${{ github.repository_owner }}/miro-workflows/api
            ghcr.io/${{ github.repository_owner }}/miro-workflows/mcp
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build + push web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + push api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + push mcp
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile.mcp
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
