name: ci

on:
  push:
    branches: [master, "feature/**", "fix/**"]
  pull_request:
    branches: [master]

# Cancel in-flight runs when a new commit lands on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit + UI + MCP tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_COLOR: "0"
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install MCP workspace
        run: cd miro-custom-mcp && pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Contract version check
        run: pnpm run contracts:check

      - name: Build contracts JSON artifacts
        run: pnpm run contracts:build

      - name: Vitest (server, contracts, scripts, agents)
        run: pnpm test

      - name: Vitest DOM (React UI)
        run: pnpm run test:ui

      - name: MCP package tests
        run: cd miro-custom-mcp && pnpm test

      - name: Coverage gate
        run: pnpm run coverage

      - name: Smoke
        run: pnpm run smoke

      - name: Validate (file + seed sanity)
        run: pnpm run validate

      - name: Bench
        run: BENCH_ITER=10 pnpm run bench

  docker:
    name: Compose lint
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: docker compose -f docker-compose.yml config -q

  publish-images:
    name: Build + push container images
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: [test, docker]
    permissions:
      contents: read
      packages: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/miro-workflows/web
            ghcr.io/${{ github.repository_owner }}/miro-workflows/api
            ghcr.io/${{ github.repository_owner }}/miro-workflows/mcp
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build + push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + push mcp
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mcp
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
