# ops/nginx/web.conf — Vite dev / production nginx front-end.
#   - serves /usr/share/nginx/html as the dashboard
#   - proxies /api to the api service (default 127.0.0.1:8787 unless set)
server {
  listen 5173;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback for client-side routes.
  location / {
    try_files $uri /index.html;
  }

  # The dashboard reaches the API through the nginx server when both
  # containers share the compose network. Override with the env var on
  # api service (`-e CORS_ORIGIN=...`).
  location /api/ {
    proxy_pass http://api:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
